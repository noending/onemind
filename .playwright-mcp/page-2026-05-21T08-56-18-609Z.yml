      - heading "把修学的长期价值， 做成可信且可持续的产品。" [level=1] [ref=e18]:
        - text: 把修学的长期价值，
        - text: 做成可信且可持续的产品。
      - paragraph [ref=e19]: 这不是一款孤立的佛学内容工具，而是一条以科学记忆为入口、以高频修学习惯为留存、以数字法藏管理为长期壁垒的产品路径。它先帮助用户真正背下来，再帮助内容长期留得住、管得清、传得稳。
