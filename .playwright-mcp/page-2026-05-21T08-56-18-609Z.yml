  - generic [ref=e45]:
    - generic [ref=e47]:
      - generic [ref=e48]: 01 / 为什么值得做
      - heading "从“想背下来”到“真的背下来”，中间缺了一套可靠工具。" [level=2] [ref=e49]
      - paragraph [ref=e50]: 佛经、咒语与修学资料长期存在，却缺少兼顾记忆效率、使用温度与资料秩序的现代产品表达。
    - generic [ref=e51]:
      - generic [ref=e52]: 修学意愿很强，但背诵过程分散、复习节奏随缘、资料陪伴零碎，最后往往只停留在“看过”而不是“受持”。
      - generic [ref=e53]:
        - generic [ref=e54]:
          - text: 需求端变化
          - heading "修学行为正在从线下固定场景，转向碎片化与长期陪伴。" [level=3] [ref=e55]
          - list [ref=e56]:
            - listitem [ref=e57]: 普通在家修行者更依赖移动端安排功课与复习。
            - listitem [ref=e58]: 优质内容越来越多，但真正沉淀为个人能力的越来越少。
            - listitem [ref=e59]: 音频、视觉、节日内容正在成为新的修学陪伴方式。
        - generic [ref=e60]:
          - text: 供给端缺口
          - heading "市场上有内容、有社群、有工具，但很少有完整闭环。" [level=3] [ref=e61]
          - list [ref=e62]:
            - listitem [ref=e63]: 内容产品偏阅读与传播，难形成背诵完成感。
            - listitem [ref=e64]: 习惯产品偏签到，缺少真正的宗教文化语境。
            - listitem [ref=e65]: 资料管理偏网盘式收纳，难承接传承秩序与权限边界。
